name: Nautic - Construction Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    name: Fabriquer Nautic
    runs-on: ubuntu-latest

    steps:
      # Recuperer les fichiers du projet
      - name: Recuperer le projet
        uses: actions/checkout@v4

      # Installer Java 17
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Preparer Android
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      # Preparer Gradle
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Construire l'application
      - name: Compiler Nautic
        run: gradle --no-daemon :app:assembleDebug

      # Conserver le fichier APK
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Nautic-Premier-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error