plugins { id "com.android.application" }

def signingPath = System.getenv("NAUTIC_KEYSTORE_PATH")
def signingPassword = System.getenv("NAUTIC_SIGNING_PASSWORD")
def signedBuild = signingPath && signingPassword

android {
    namespace "fr.nautic.test"
    compileSdk 35

    defaultConfig {
        applicationId "fr.nautic.test"
        minSdk 23
        targetSdk 28
        versionCode = Integer.parseInt((project.findProperty("nauticVersionCode") ?: "2").toString())
        versionName = (project.findProperty("nauticVersionName") ?: "0.4.2").toString()
    }

    // Distribution directe hors Google Play : conserver le comportement Android existant.
    // À revoir lors de la migration vers un targetSdk récent.
    lint {
        disable "ExpiredTargetSdkVersion"
    }

    signingConfigs {
        nauticRelease {
            if (signedBuild) {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias "nautic"
                keyPassword signingPassword
                storeType "pkcs12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signedBuild) signingConfig signingConfigs.nauticRelease
        }
    }
}
